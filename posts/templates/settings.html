{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile • Leensgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #fafafa; display: flex; justify-content: center; padding-top: 50px; }
        .settings-container { background: #fff; width: 935px; border: 1px solid #dbdbdb; display: flex; min-height: 80vh; border-radius: 4px; }
        .settings-sidebar { width: 250px; border-right: 1px solid #dbdbdb; padding: 20px 0; }
        .sidebar-item { padding: 15px 30px; font-size: 16px; cursor: pointer; color: #262626; display: flex; align-items: center; gap: 15px; }
        .sidebar-item.active { font-weight: bold; border-left: 2px solid #000; }
        .settings-content { flex: 1; padding: 40px 100px; }
        .edit-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: #efefef; padding: 15px; border-radius: 12px; }
        .edit-header img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 10px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #dbdbdb; border-radius: 8px; background: #fafafa; font-size: 14px; outline: none; }
        .submit-btn { background: #0095f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-change { background: #0095f6; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; margin-left: auto; }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="settings-sidebar">
            <h2 style="padding: 0 30px 20px 30px;">Settings</h2>
            <div class="sidebar-item active"><i class="fa-regular fa-circle-user"></i> Edit profile</div>
        </div>
        <div class="settings-content">
            <h2>Edit profile</h2>
            <form action="" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="edit-header">
                    {% if user_profile.profileimg %}
                        <img src="{{user_profile.profileimg.url}}" alt="pfp">
                    {% else %}
                        <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="pfp">
                    {% endif %}
                    <div>
                        <b>{{request.user.username}}</b><br>
                        <span style="color: #8e8e8e; font-size: 13px;">{{user_profile.full_name}}</span>
                    </div>
                    <!-- Hidden input, triggered by button -->
                    <input type="file" name="image" id="id_image" hidden>
                    <button type="button" class="btn-change" onclick="document.getElementById('id_image').click()">Change photo</button>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" value="{{user_profile.full_name}}">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" rows="3">{{user_profile.bio}}</textarea>
                </div>
                <div class="form-group">
                    <label>Website</label>
                    <input type="text" name="website" value="{{user_profile.website}}">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="" {% if user_profile.gender == "" %}selected{% endif %}>Prefer not to say</option>
                        <option value="Male" {% if user_profile.gender == "Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if user_profile.gender == "Female" %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>
