{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore • Leensgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fff; display: flex; }

        .sidebar { width: 245px; height: 100vh; background: #fff; border-right: 1px solid #dbdbdb; position: fixed; padding: 20px 12px; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; padding: 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; text-decoration: none; color: #000; }
        .nav-item:hover { background-color: #f2f2f2; }
        .nav-item i { font-size: 24px; width: 30px; margin-right: 16px; }

        .explore-container { margin-left: 245px; width: 100%; display: flex; justify-content: center; padding: 30px 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; max-width: 935px; width: 100%; }
        
        .grid-item { position: relative; aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer; background-color: #efefef; }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; }
        
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.3); color: white; display: flex; 
            justify-content: center; align-items: center; gap: 20px; 
            opacity: 0; transition: opacity 0.3s; font-weight: bold; 
        }
        .grid-item:hover .overlay { opacity: 1; }
        .grid-item:hover img, .grid-item:hover video { filter: brightness(0.8); }

        .media-icon { position: absolute; top: 10px; right: 10px; color: white; text-shadow: 0 0 3px black; font-size: 18px; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <a href="/" style="font-size: 28px; font-weight: bold; text-decoration: none; color: black; margin-bottom: 30px; padding-left: 10px;">Leensgram</a>
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="/explore" class="nav-item" style="font-weight: bold;"><i class="fa-solid fa-compass"></i><span>Explore</span></a>
        <a href="/reels" class="nav-item"><i class="fa-solid fa-clapperboard"></i><span>Reels</span></a>
        <a href="/profile/{{user.username}}" class="nav-item"><i class="fa-regular fa-circle-user"></i><span>Profile</span></a>
        <a href="{% url 'logout' %}" class="nav-item" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>

    <!-- EXPLORE GRID -->
    <div class="explore-container">
        <div class="grid">
            {% for post in all_posts %}
            <div class="grid-item">
                <a href="/profile/{{post.user.username}}">
                    
                    <!-- UPDATED LOGIC TO SHOW PHOTOS FOR EVERYONE -->
                    {% if post.image %}
                        <!-- 1. Shows if you manually uploaded a photo -->
                        <img src="{{post.image.url}}" alt="post">
                    {% elif post.video_file %}
                        <!-- 2. Shows if you manually uploaded a video -->
                        <video src="{{post.video_file.url}}"></video>
                        <div class="media-icon"><i class="fa-solid fa-play"></i></div>
                    {% else %}
                        <!-- 3. FALLBACK: Fixes empty grids for the 100 test users -->
                        <img src="https://picsum.photos/500/500?random={{post.id}}" alt="internet-photo">
                    {% endif %}

                    <div class="overlay">
                        <span><i class="fa-solid fa-heart"></i> {{post.no_of_likes}}</span>
                        <!-- Logic for comments count -->
                        <span><i class="fa-solid fa-comment"></i> {{post.comments.count|default:"0"}}</span>
                    </div>
                </a>
            </div>
            {% empty %}
            <p style="grid-column: span 3; text-align: center; color: #8e8e8e;">No posts to discover yet.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
