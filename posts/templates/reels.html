{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reels • Leensgram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; display: flex; }
        .sidebar { width: 245px; height: 100vh; background: #000; border-right: 1px solid #262626; padding: 20px 12px; display: flex; flex-direction: column; position: fixed; }
        .nav-item { display: flex; align-items: center; padding: 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; text-decoration: none; color: #fff; }
        .reels-wrapper { margin-left: 245px; width: calc(100% - 245px); height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-wrapper::-webkit-scrollbar { display: none; }
        .reel-container { width: 100%; height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
        .video-card { width: 380px; height: 90vh; background: #111; border-radius: 12px; position: relative; overflow: hidden; }
        
        /* Video stays background, controls hidden but active */
        video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .reel-info { position: absolute; bottom: 20px; left: 15px; z-index: 10; width: 80%; }
        .user-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .user-meta img { width: 32px; border-radius: 50%; border: 1.5px solid #fff; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2 style="padding: 10px; font-style: italic;">Leensgram</h2>
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i>&nbsp;&nbsp;Home</a>
        <a href="/reels/" class="nav-item" style="background: #1a1a1a;"><i class="fa-solid fa-clapperboard"></i>&nbsp;&nbsp;Reels</a>
        <a href="/profile/{{user.username}}" class="nav-item"><i class="fa-regular fa-circle-user"></i>&nbsp;&nbsp;Profile</a>
    </nav>

    <div class="reels-wrapper">
        {% for reel in reels %}
        <div class="reel-container">
            <div class="video-card">
                <video 
    loop 
    muted 
    autoplay 
    playsinline
    onclick="togglePlay(this)"
    src="{{ reel.video_url }}">
</video>

<div class="reel-info">
    <div class="user-meta">
        <!-- Profile pic logic -->
        <img src="https://i.pravatar.cc/150?u={{reel.user}}">
        <b>{{ reel.user }}</b>
    </div>
    <p>{{ reel.caption }}</p>
</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        // Start first video
        window.addEventListener('load', () => {
            const vids = document.querySelectorAll('video');
            if(vids.length > 0) vids[0].play();
        });

        // Intersection Observer to play/pause on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.play();
                    } else {
                        video.pause();
                        video.currentTime = 0; // Restart when coming back
                    }
                }
            });
        }, { threshold: 0.8 });

        document.querySelectorAll('.reel-container').forEach(c => observer.observe(c));

        function togglePlay(v) {
            if (v.paused) v.play(); else v.pause();
            v.muted = !v.muted; // Unmute on first tap
        }
    </script>
</body>
</html>
