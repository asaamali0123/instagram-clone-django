<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • Leensgram</title>
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 40px; text-align: center; box-sizing: border-box; }
        .logo { font-size: 35px; font-weight: bold; margin-bottom: 10px; }
        h2 { font-size: 17px; color: #8e8e8e; font-weight: 600; line-height: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 9px 7px; margin-bottom: 7px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; font-size: 12px; }
        .birthday-header { text-align: left; font-size: 12px; color: #8e8e8e; margin: 10px 0 5px 0; }
        .birthday-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .btn-submit { background-color: #0095f6; color: white; border: none; border-radius: 8px; font-weight: 600; padding: 7px; width: 100%; cursor: pointer; margin-top: 10px; }
        .terms { font-size: 11px; color: #8e8e8e; margin-top: 15px; line-height: 15px; }
        .login-box { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 20px; text-align: center; margin-top: 10px; font-size: 14px; }
        .btn-login-outline { background: transparent; border: 1px solid #dbdbdb; color: #262626; padding: 7px; width: 100%; border-radius: 20px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <div class="container">
            <div class="logo">Leensgram</div>
            <h2>Get started on Leensgram</h2>
            <p style="color: #8e8e8e; font-size: 14px;">Sign up to see photos and videos from your friends.</p>
            
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="mobile_or_email" placeholder="Mobile number or email" required>
                <input type="password" name="password" placeholder="Password" required>
                
                <div class="birthday-header">Birthday ⓘ</div>
                <div class="birthday-row">
                    <select name="month">
                        {% for i in months %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
                    </select>
                    <select name="day">
                        {% for i in days %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
                    </select>
                    <select name="year">
                        {% for i in years %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
                    </select>
                </div>

                <input type="text" name="full_name" placeholder="Full name" required>
                <input type="text" name="username" placeholder="Username" required>

                <div class="terms">
                    By tapping Submit, you agree to our <b>Terms</b>, <b>Privacy Policy</b> and <b>Cookies Policy</b>.
                </div>
                
                <button type="submit" class="btn-submit">Submit</button>
                <!-- Put this inside the <div class="container"> -->
{% for message in messages %}
    <p style="color: #ed4956; font-size: 14px; font-weight: bold; margin-bottom: 10px;">
        {{ message }}
    </p>
{% endfor %}


            </form>
        </div>

        <div class="login-box">
            <a href="{% url 'login' %}" style="text-decoration: none;">
                <button class="btn-login-outline">I already have an account</button>
            </a>
        </div>
    </div>
</body>
</html>
